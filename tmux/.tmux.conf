# ── Prefix key ─────────────────────────────────────────────────────
# remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-a
# Press Ctrl+a twice to send it to the program inside the pane
bind C-a send-prefix

# ── General ───────────────────────────────────────────────────────────
# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
# Enable clipboard integration
set -g set-clipboard on 
# Number windows and panes from 1, so the first window is Prefix + 1
set -g base-index 1
set -g pane-base-index 1
# Renumber windows sequentially after closing any of them
set -g renumber-windows on 
# Enable automatic rename but do not change window name automatically once it is manually set
set -g automatic-rename on
set -g allow-rename off
# Increase scrollback buffer size
set -g history-limit 100000 
# Wait only 10ms after Esc, so Vim and Neovim react at once
set -g escape-time 10
# Display tmux messages for 3 seconds.
set -g display-time 3000 
# Restore screen when exiting an interactive application
setw -g alternate-screen on 
# don't exit from tmux when closing a session
set -g detach-on-destroy off  
# Set the terminal window title to session and window name
set -g set-titles on
set -g set-titles-string "#S / #W"
# Mark windows with new output in the status line
setw -g monitor-activity on
# reload config
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded..."

# ── Panes and windows ─────────────────────────────────────────────────
# Prefix + | splits left/right and Prefix + - splits top/bottom, in the current directory
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# set window split & create new window with the same current path
bind-key c new-window -c "#{pane_current_path}"
unbind '"'
unbind %
# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Alt + arrow keys move between panes without the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D
# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
# bind key to exit tmux & terminal at once
bind-key -n C-d detach

# ── Copy mode and clipboard ───────────────────────────────────────────
# vi keys in copy mode (h/j/k/l, /, ?, w, b ...)
setw -g mode-keys vi
# Vim-like selection: v starts, Ctrl+v toggles block mode, y copies and exits
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"

# ── Status line ───────────────────────────────────────────────────────
# Redraw the status line every 5 seconds (default 15)
set -g status-interval 5
# Status line colors, with the current window highlighted
set -g status-style "bg=default,fg=#a9b1d6"
setw -g window-status-style "fg=#a9b1d6"
setw -g window-status-current-style "bg=default,fg=#9ece6a,bold"
setw -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
setw -g window-status-separator ""
# Nothing on the right of the status line
set -g status-right ""

# ── Pane borders ──────────────────────────────────────────────────────
# Draw pane borders with double lines
setw -g pane-border-lines double
# Show each pane's number and running command in its border
setw -g pane-border-status top
setw -g pane-border-format " #P: #{pane_current_command} "

# ── Colors and terminal ───────────────────────────────────────────────
# Enable true color and italics
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# 24-bit true color when the outer terminal's TERM is xterm-256color (3.6+ also detects COLORTERM=truecolor)
set -as terminal-features ",xterm-256color:RGB"
# Tell Shift+Enter apart from Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
# Undercurls and coloured underlines for LSP diagnostics (tmux 3.2+)
set -as terminal-features ",xterm*:usstyle"
# Allow passthrough escape sequences (images in yazi, kitty graphics)
setw -g allow-passthrough on